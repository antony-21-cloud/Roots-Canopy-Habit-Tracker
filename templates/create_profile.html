<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Your Profile</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <div class="profile-form-container">
            <h1>👤 Create Your Profile</h1>
            <p>Tell us a bit about yourself to start your journey.</p>
            
            <form method="POST" class="form">
                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" name="name" required 
                        placeholder="e.g., John Doe">
                </div>
                
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required 
                        placeholder="e.g., john@example.com">
                </div>
                
                <button type="submit" class="btn-primary">🚀 Start My Journey</button>
            </form>
            
            <p class="form-note">💡 This profile will store all your goals, trees, and progress.</p>
        </div>
    </div>

    <style>
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .profile-form-container {
            max-width: 500px;
            width: 100%;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        
        .profile-form-container h1 {
            text-align: center;
            color: #1a3a1a;
            margin-bottom: 4px;
            font-size: 2rem;
        }
        
        .profile-form-container > p {
            text-align: center;
            color: #4a6a4a;
            margin-bottom: 24px;
        }
        
        .form {
            margin-top: 20px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #1a3a1a;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #d0e0d0;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #2d5a2d;
        }
        
        .form-group input::placeholder {
            color: #a0b0a0;
        }
        
        .btn-primary {
            width: 100%;
            background: #2d5a2d;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .btn-primary:hover {
            background: #1a3a1a;
        }
        
        .form-note {
            text-align: center;
            color: #6a8a6a;
            font-size: 0.9rem;
            margin-top: 16px;
        }
        
        /* Flash messages */
        .flash-messages {
            margin-bottom: 16px;
        }
        
        .flash-message {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        .flash-message.error {
            background: #fde8e8;
            color: #8a3a3a;
            border: 1px solid #f5d0d0;
        }
        
        .flash-message.success {
            background: #e8f5e8;
            color: #2d5a2d;
            border: 1px solid #d0e8d0;
        }
    </style>
</body>
</html>
