<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant Your Tree</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <div class="wizard-container">
            <div class="welcome-steps">
                <div class="step completed">1. Goal</div>
                <div class="step active">2. Tree</div>
                <div class="step">3. Habit</div>
            </div>

            <div class="wizard-content">
                <h1>🌳 Plant Your First Tree</h1>
                <p>Trees are a major milestone on your path.Planting a tree symbolises a new begining on your path to achieving your goal</p>
                <p><strong>Goal:</strong> {{ goal.title }}</p>

                <form method="POST" class="form">
                    <div class="form-group">
                        <label for="name">Tree Name</label>
                        <input type="text" id="name" name="name" required 
                            placeholder="e.g., complete a course" autofocus>
                    </div>

                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" name="description" rows="3" 
                                placeholder="What will you achieve at this station?"></textarea>
                    </div>

                    <button type="submit" class="btn-primary">Next → Add a Habit</button>
                </form>
            </div>
        </div>
    </div>

    <style>
        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .wizard-container {
            width: 100%;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .welcome-steps {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
        }
        .step {
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.85rem;
            background: #e8ece8;
            color: #6a8a6a;
        }
        .step.active {
            background: #4a8a4a;
            color: white;
        }
        .step.completed {
            background: #2d5a2d;
            color: white;
        }
        .wizard-content h1 {
            margin: 0 0 4px 0;
            color: #1a3a1a;
        }
        .wizard-content p {
            color: #4a6a4a;
            margin: 0 0 4px 0;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #1a3a1a;
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #d0e0d0;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #2d5a2d;
        }
        .btn-primary {
            width: 100%;
            background: #2d5a2d;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-primary:hover {
            background: #1a3a1a;
        }
    </style>
</body>
</html>
