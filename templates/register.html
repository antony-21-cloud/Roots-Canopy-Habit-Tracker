<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Roots & Canopy</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>🌱 Create Your Account</h1>
                <p>Start your journey today</p>
            </div>
            
            <form method="POST" class="auth-form">
                <div class="form-group">
                    <label for="name">👤 Full Name</label>
                    <input type="text" id="name" name="name" required placeholder="John Doe">
                </div>
                
                <div class="form-group">
                    <label for="email">📧 Email</label>
                    <input type="email" id="email" name="email" required placeholder="john@example.com">
                </div>
                
                <div class="form-group">
                    <label for="password">🔒 Password</label>
                    <input type="password" id="password" name="password" required placeholder="Min 6 characters">
                </div>
                
                <div class="form-group">
                    <label for="confirm_password">🔒 Confirm Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" required placeholder="Confirm your password">
                </div>
                
                <button type="submit" class="btn-primary">🌱 Create Account</button>
            </form>
            
            <p class="auth-link">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
        </div>
    </div>
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #e8f0e8 0%, #c0d8c0 100%);
            padding: 20px;
        }
        .auth-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        }
        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }
        .auth-header h1 {
            font-size: 2rem;
            color: #1a3a1a;
            margin: 0;
        }
        .auth-header p {
            color: #4a6a4a;
            margin: 4px 0 0 0;
        }
        .auth-form .form-group {
            margin-bottom: 16px;
        }
        .auth-form label {
            display: block;
            font-weight: 600;
            color: #1a3a1a;
            margin-bottom: 6px;
        }
        .auth-form input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #d0e0d0;
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        .auth-form input:focus {
            outline: none;
            border-color: #2d5a2d;
        }
        .btn-primary {
            width: 100%;
            background: #2d5a2d;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 8px;
        }
        .btn-primary:hover {
            background: #1a3a1a;
        }
        .auth-link {
            text-align: center;
            margin-top: 16px;
            color: #4a6a4a;
        }
        .auth-link a {
            color: #2d5a2d;
            font-weight: bold;
            text-decoration: none;
        }
        .auth-link a:hover {
            text-decoration: underline;
        }
        .flash-messages {
            margin-bottom: 16px;
        }
        .flash-message {
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 6px;
        }
        .flash-message.error {
            background: #fde8e8;
            color: #8a3a3a;
            border: 1px solid #f5d0d0;
        }
        .flash-message.success {
            background: #e8f5e8;
            color: #2d5a2d;
            border: 1px solid #d0e8d0;
        }
    </style>
</body>
</html>
